[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhcoin"
version = "0.4.1.6"
description = "MHCOIN (MHC) — independent Proof-of-Work blockchain"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42.0.0",
    "click>=8.1.0",
    "pycryptodome>=3.20.0",
    "mnemonic>=0.21",
    "lmdb>=1.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]
desktop = [
    "pyinstaller>=6.0",
    "pywebview>=5.0",
    "appdirs>=1.4.4",
]

[project.scripts]
mhcoin = "mhcoin.cli.main:cli"
mhcoin-core = "mhcoin.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mhcoin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
